[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gala-agent"
version = "0.1.0"
description = "Agent-facing SDK for the Gala quantum-classical language: wraps the gala CLI"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
