name: Release

on:
  push:
    tags: ["v*.*.*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build release binaries
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable-2026-04-14

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --workspace

      - name: Stage release binaries
        run: |
          mkdir -p dist
          for b in gala gala-fmt gala-lsp gala-cli gala-lint gala-pkg; do
            install -m 0755 "target/release/$b" "dist/$b-${{ matrix.os }}"
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gala-dist-${{ matrix.os }}
          path: dist/
          retention-days: 90

  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: [build]
    if: github.repository_owner != ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}${GITHUB_REF#refs/tags/}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-buildcache:latest
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-buildcache:latest,mode=max

  nix-flake:
    name: Nix flake bump (manual)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Note
        run: |
          echo "Update the Nix flake inputs/lock (cargoHash) for the new release,"
          echo "then open a PR: cargoHash must be recomputed for the tagged Cargo.lock."

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [build, docker]
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes from CHANGELOG
        run: |
          if [ -f CHANGELOG.md ]; then
            awk '/^## /{if(seen) exit; seen=1} seen{print}' CHANGELOG.md > release-notes.md
          else
            echo "CHANGELOG.md not found — using auto-generated notes" > release-notes.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/*
            Dockerfile
          draft: false
