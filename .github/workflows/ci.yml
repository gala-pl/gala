name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_TOOLCHAIN: stable-2026-04-14

jobs:
  cargo:
    name: cargo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable-2026-04-14
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (all targets)
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Verify cookbook recipes compile
        run: |
          for f in $(find cookbook -name '*.gala'); do
            cargo run --bin gala -- check "$f"
          done

      - name: Verify docs
        run: cargo doc --workspace --no-deps

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}${{ github.ref }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-buildcache:latest
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-buildcache:latest,mode=max

      - name: Smoke test image
        run: |
          docker run --rm ghcr.io/${{ github.repository }}:latest --help

  bazel:
    name: bazel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 10 (inkwell dependency)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-10 llvm-10-dev clang-10 libllvm10

      - name: Install Bazelisk
        run: |
          curl -L https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64 -o /usr/local/bin/bazel
          chmod +x /usr/local/bin/bazel

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/Library/Caches/Bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'Cargo.lock', '*.bzl', 'crates/*/BUILD.bazel') }}

      - name: Build
        run: bazel build //...

      - name: Test
        run: bazel test //...

  nix:
    name: nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Nix flake check
        run: nix flake check

      - name: Nix build
        run: nix build .#packages.${{ runner.os == 'macOS' && 'aarch64-darwin' || 'x86_64-linux' }}.default
