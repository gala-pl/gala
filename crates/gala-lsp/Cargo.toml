[package]
name = "gala-lsp"
version = "0.1.0"
edition = "2021"
description = "Language Server Protocol implementation for Gala"
license = "Apache-2.0"
repository = "https://github.com/gala-lang/gala"

[lib]
name = "gala_lsp"
path = "src/lib.rs"

[[bin]]
name = "gala-lsp"
path = "src/main.rs"

[dependencies]
gala-ast.workspace = true
gala-diagnostics.workspace = true
gala-driver.workspace = true
gala-gir.workspace = true
gala-hir.workspace = true
gala-parser.workspace = true
gala-span.workspace = true
gala-types.workspace = true
serde_json.workspace = true
