[package]
name = "gala-codegen-classical"
version.workspace = true
edition.workspace = true
description = "Classical codegen (Cranelift/LLVM) for Gala"
license.workspace = true
repository.workspace = true

[lib]
name = "gala_codegen_classical"
path = "src/lib.rs"

[features]
default = []
classical = ["inkwell"]

[dependencies]
inkwell = { version = "0.2", features = ["llvm10-0", "target-x86", "target-aarch64"], optional = true }
cranelift-codegen = "=0.135.0"
cranelift-frontend = "=0.135.0"
cranelift-module = "=0.135.0"
cranelift-native = "=0.135.0"
cranelift-object = "=0.135.0"
gala-gir.workspace = true
gala-ast.workspace = true
gala-types.workspace = true
gala-qir.workspace = true
gala-opt.workspace = true
gala-span.workspace = true
gala-diagnostics.workspace = true
